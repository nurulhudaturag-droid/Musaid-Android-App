name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-debug:
    name: Test + Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages (best effort)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --list 2>/dev/null | grep -oE 'platforms;android-36(\.[0-9]+)?' | sort -u \
            | while read -r p; do "$SDKMANAGER" --install "$p" || true; done
          "$SDKMANAGER" --install "platform-tools" "build-tools;36.0.0" || true

      - name: Generate debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android \
              -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10950 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests (with Roborazzi capture)
        run: ./gradlew :app:testDebugUnitTest :app:recordRoborazziDebug --stacktrace

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-screenshots
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: musaid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

  release:
    name: Signed release APK
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test-and-debug
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages (best effort)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --list 2>/dev/null | grep -oE 'platforms;android-36(\.[0-9]+)?' | sort -u \
            | while read -r p; do "$SDKMANAGER" --install "$p" || true; done
          "$SDKMANAGER" --install "platform-tools" "build-tools;36.0.0" || true

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret missing (base64 of your .jks file: base64 -w0 my-upload-key.jks)"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$HOME/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$HOME/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK (R8 minified)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || { echo "::error::ANDROID_KEYSTORE_PASSWORD secret missing"; exit 1; }
          [ -n "$ANDROID_KEY_ALIAS" ] || { echo "::error::ANDROID_KEY_ALIAS secret missing"; exit 1; }
          [ -n "$ANDROID_KEY_PASSWORD" ] || { echo "::error::ANDROID_KEY_PASSWORD secret missing"; exit 1; }
          ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare APK name
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$APK" "musaid-${GITHUB_REF_NAME}.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: musaid-release-apk
          path: musaid-*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" musaid-*.apk --generate-notes --verify-tag \
            || gh release upload "$GITHUB_REF_NAME" musaid-*.apk --clobber
